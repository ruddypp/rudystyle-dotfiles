# Hyprland config
# Isi: monitor + env + keybind. UI/decoration = default Hyprland (tambah sendiri).

# ─── MONITORS ───────────────────────────────────────────────
monitor = eDP-1, 1920x1080@60, 0x0, 1
monitor = HDMI-A-1, preferred, auto-left, 1

# ─── ENVIRONMENT ────────────────────────────────────────────
# Isolasi: semua setelan look Hyprland lewat env.
# env TIDAK nulis ke dconf → GNOME ga kesentuh.
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,WhiteSur-cursors
# Tema GTK kamar WM TIDAK lewat env. Sumbernya dconf db hypr:
#   gsettings set org.gnome.desktop.interface gtk-theme WhiteSur-Dark
# dibaca app lewat xdg-desktop-portal. Jangan hidupin GTK_THEME lagi:
# dia nimpa dconf dan matiin ganti light/dark di GTK4.
# dconf/gsettings Hyprland = database sendiri (ga nyentuh dconf GNOME)
env = DCONF_PROFILE,/home/ruddypp/.config/hypr/dconf-profile
# GPU: AMD primary, NVIDIA secondary (hybrid)
env = AQ_DRM_DEVICES,/dev/dri/card2:/dev/dri/card1
env = WLR_DRM_DEVICES,/dev/dri/card2:/dev/dri/card1

# Jangan baca cursor theme dari gsettings/dconf (biar ga nyampur GNOME)
cursor {
    sync_gsettings_theme = false
}

# ─── KEYBINDINGS ────────────────────────────────────────────
$mainMod = SUPER

# Apps
bind = $mainMod, Return, exec, ghostty
bind = $mainMod, E, exec, nautilus --new-window
bind = $mainMod, B, exec, firefox
bind = $mainMod, C, exec, code
bind = $mainMod, R, exec, wofi --show drun
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, M, exit,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Screenshot (grim + slurp)

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Resize
bind = $mainMod CTRL, left, resizeactive, -40 0
bind = $mainMod CTRL, right, resizeactive, 40 0
bind = $mainMod CTRL, up, resizeactive, 0 -40
bind = $mainMod CTRL, down, resizeactive, 0 40

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window ke workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll workspaces
bind = $mainMod, mouse_down, workspace, r+1
bind = $mainMod, mouse_up, workspace, r-1

# Move/resize pake mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume + brightness + media
bindle = , XF86AudioRaiseVolume, exec, /home/ruddypp/.local/bin/osd-volume up
bindle = , XF86AudioLowerVolume, exec, /home/ruddypp/.local/bin/osd-volume down
bindl = , XF86AudioMute, exec, /home/ruddypp/.local/bin/osd-volume mute
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindle = , XF86MonBrightnessUp, exec, /home/ruddypp/.local/bin/osd-brightness up
bindle = , XF86MonBrightnessDown, exec, /home/ruddypp/.local/bin/osd-brightness down
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause

# ─── SESSION ENV → systemd / D-Bus ──────────────────────────
# "env =" cuma diwarisin ke anak Hyprland. xdg-desktop-portal-gtk
# dinyalain systemd/D-Bus, jadi tanpa ini dia baca dconf GNOME —
# icon/cursor/font kamar WM bakal bocor ikut DE.
exec-once = dbus-update-activation-environment --systemd DCONF_PROFILE XDG_CURRENT_DESKTOP XDG_SESSION_TYPE WAYLAND_DISPLAY
exec-once = systemctl --user restart xdg-desktop-portal-gtk.service

# ─── AUTOSTART ──────────────────────────────────────────────
exec-once = waybar

# ─── DOCK ───────────────────────────────────────────────────
exec-once = nwg-dock-hyprland -r -x -i 48 -mb 6 -lp start -c /home/ruddypp/.local/bin/launchpad
bind = $mainMod, D, exec, pkill -RTMIN+1 -f nwg-dock-hyprland

# Hyprland 0.53+ merombak sintaks rule: wajib pakai penanda "match:".
# Sintaks lama (layerrule = blur, waybar) ditolak diam-diam lewat reload,
# baru kelihatan di `hyprctl configerrors`.
layerrule = blur on, ignore_alpha 0.2, match:namespace waybar
layerrule = blur on, ignore_alpha 0.2, match:namespace nwg-dock

# ─── TAMPILAN JENDELA (kamar WM) ────────────────────────────
# Berlaku ke SEMUA aplikasi, bukan cuma terminal.
decoration {
    rounding = 10
    active_opacity = 0.96
    inactive_opacity = 0.92
    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }
}
layerrule = blur on, ignore_alpha 0.2, match:namespace rofi

# ─── INPUT / TOUCHPAD (kamar WM) ────────────────────────────
# Hyprland TIDAK baca dconf peripherals punya GNOME. Semua di sini,
# jadi arah scroll dua sesi diatur sendiri-sendiri.
input {
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# ─── GESTURE 3 JARI ─────────────────────────────────────────
gesture = 3, horizontal, workspace
gesture = 3, up, dispatcher, exec, /home/ruddypp/.local/bin/launchpad

# ─── SCREENSHOT ─────────────────────────────────────────────
bind = , Print, exec, pgrep -x slurp || grimblast --notify --freeze copy area
bind = SHIFT, Print, exec, grimblast --notify copy screen
bind = CTRL, Print, exec, pgrep -x slurp || grimblast --notify --freeze copysave area
gesture = 3, down, dispatcher, exec, pkill -x rofi

# ─── NOTIFIKASI ─────────────────────────────────────────────
exec-once = swaync
bind = $mainMod, N, exec, swaync-client -t -sw
layerrule = blur on, ignore_alpha 0.2, match:namespace swaync-notification-window
layerrule = blur on, ignore_alpha 0.2, match:namespace swaync-control-center

# ─── WALLPAPER ──────────────────────────────────────────────
# Sumber gambar = dconf kamar hypr (panel Background di Settings).
exec-once = hyprpaper
exec-once = /home/ruddypp/.local/bin/wallpaper-watch
